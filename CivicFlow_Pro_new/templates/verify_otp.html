<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check | CivicFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body { 
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', sans-serif;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-card {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            border-top: 5px solid #0b1e4c; /* Blue for Login */
        }
        .icon-circle {
            width: 80px; height: 80px;
            background: #e3f2fd;
            color: #0b1e4c;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }
        .timer-text {
            font-size: 2rem;
            font-weight: 800;
            color: #dc3545;
            letter-spacing: 2px;
            margin: 10px 0;
        }
        .otp-input {
            font-size: 28px;
            letter-spacing: 15px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 10px;
            color: #0b1e4c;
            transition: all 0.3s;
        }
        .otp-input:focus {
            border-color: #0b1e4c;
            box-shadow: 0 0 0 0.25rem rgba(11, 30, 76, 0.25);
            outline: none;
        }
        .btn-verify {
            background: #0b1e4c; color: white;
            border: none; padding: 12px;
            font-weight: bold; font-size: 1.1rem;
            border-radius: 8px; width: 100%;
            transition: 0.3s;
        }
        .btn-verify:hover { background: #1a4a9c; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="otp-card animate__animated animate__fadeInUp">
        <div class="p-4 p-md-5">
            
            <div class="icon-circle">
                <i class="fas fa-shield-alt"></i>
            </div>

            <h4 class="fw-bold text-dark">Security Check</h4>
            <p class="text-muted small mb-4">
                Enter the Unified OTP sent to your registered contact.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} p-2 small shadow-sm">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div id="timer" class="timer-text">02:00</div>
            <p class="text-muted" style="font-size: 0.8rem;">Session Expires In</p>

            <form method="POST" action="{{ url_for('verify_login_otp') }}" autocomplete="off">
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control otp-input" 
                           placeholder="000000" maxlength="6" required autofocus>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-verify shadow-sm" id="verifyBtn">
                        Verify Identity <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    <div class="d-flex justify-content-between mt-2">
                        <a href="{{ url_for('resend_login_otp') }}" class="btn btn-light btn-sm text-primary fw-bold" id="resendBtn" style="pointer-events: none; opacity: 0.5;">
                            Resend OTP
                        </a>
                        <a href="{{ url_for('citizen_login') }}" class="btn btn-light btn-sm text-muted">
                            <i class="fas fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        let timeLeft = 120; // 2 Minutes
        let timerElement = document.getElementById("timer");
        let btn = document.getElementById("verifyBtn");

        let downloadTimer = setInterval(function(){
            if(timeLeft <= 0){
                clearInterval(downloadTimer);
                timerElement.innerHTML = "EXPIRED";
                timerElement.style.color = "#6c757d";
                btn.disabled = true;
                btn.innerHTML = "Session Expired";
                btn.style.background = "#6c757d";
                document.getElementById('resendBtn').style.pointerEvents = "auto";
                document.getElementById('resendBtn').style.opacity = "1";
            } else {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                s = s < 10 ? "0" + s : s;
                timerElement.innerHTML = "0" + m + ":" + s;

                if(timeLeft <= 90) { // Enable resend after 30 seconds
                    document.getElementById('resendBtn').style.pointerEvents = "auto";
                    document.getElementById('resendBtn').style.opacity = "1";
                }
            }
            timeLeft -= 1;
        }, 1000);
    </script>

</body>
</html>
