<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Developer Console Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a; /* Dark theme for devs */
            color: #00ff00;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .login-card {
            background-color: #2b2b2b;
            border: 1px solid #00ff00;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .form-control {
            background-color: #000;
            border: 1px solid #444;
            color: #00ff00;
        }
        .form-control:focus {
            background-color: #111;
            color: #00ff00;
            border-color: #00ff00;
            box-shadow: none;
        }
        .btn-dev {
            background-color: #007f00;
            color: black;
            font-weight: bold;
            border: none;
        }
        .btn-dev:hover {
            background-color: #00ff00;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="text-center mb-4">
            <h3>&lt;Dev_Console /&gt;</h3>
            <p class="small text-muted">System Maintenance Access</p>
        </div>

        {% if error %}
        <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>ROOT_USER</label>
                <input type="email" name="email" class="form-control" placeholder="admin@system.local" required>
            </div>
            <div class="mb-4">
                <label>ACCESS_KEY</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-dev w-100">INITIALIZE SESSION</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small">[ Return to Hub ]</a>
        </div>
    </div>

</body>
</html>
