<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Citizen Login | CivicFlow Pro</title>

    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body { 
            /* Matches the subtle, professional gradient of the Signup page */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            border-top: 5px solid #0b1e4c; /* Consistent Branding Accent */
        }
        .brand-header { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #0b1e4c; 
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #0b1e4c;
            box-shadow: 0 0 0 0.2rem rgba(11, 30, 76, 0.25);
        }
        .btn-login { 
            background-color: #0b1e4c; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-weight: bold; 
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .btn-login:hover { 
            background-color: #1a4a9c; 
            transform: translateY(-2px); 
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card animate__animated animate__fadeInUp">
        <div class="brand-header">
            <i class="fas fa-user-circle fa-3x mb-3 text-primary"></i>
            <h3 class="fw-bold">Citizen Login</h3>
            <p class="text-muted">Access your grievance dashboard</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show text-center small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login/citizen" autocomplete="off">
            <div class="mb-3">
                <label class="form-label fw-bold small text-uppercase text-muted">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" required placeholder="name@example.com" autocomplete="new-password">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold small text-uppercase text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" required placeholder="********" autocomplete="new-password">
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-login shadow-sm">
                    Secure Login <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </div>
        </form>
        
        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-2">New to CivicFlow?</p>
            <a href="{{ url_for('signup') }}" class="btn btn-outline-dark btn-sm rounded-pill px-4">Create Account</a>
            
            <div class="mt-3">
                <a href="{{ url_for('admin_login') }}" class="text-decoration-none text-muted small me-3">
                    <i class="fas fa-user-shield me-1"></i> Officer Login
                </a>
                <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small">
                    <i class="fas fa-home me-1"></i> Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
